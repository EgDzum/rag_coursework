dataset:
  path: data/raw/agriculture.jsonl

chunking:
  chunk_size: 1200
  chunk_overlap: 150

embedding:
  model: Qwen/Qwen3-Embedding-0.6B
  batch_size: 16
  normalize: true
  max_length: 2048

llm:
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  max_new_tokens: 1024
  batch_size: 1
  temperature: 0.0
  max_input_tokens: 3072

retrieval:
  top_k_vector: 4
  top_k_graph: 3
  max_hops: 2

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: password
  database: neo4j

faiss:
  index_path: indexes/faiss/index.faiss
  metadata_path: indexes/faiss/metadata.json

runtime:
  seed: 42